name: 'Graph Visualization'
description: 'Generate Terraform dependency graph'

inputs:
  working_directory:
    description: 'Working directory'
    required: false
    default: '.'
  output_format:
    description: 'Output format (svg, png, pdf)'
    required: false
    default: 'svg'

runs:
  using: 'composite'
  steps:
    - name: Install Graphviz
      shell: bash
      run: sudo apt-get install -y graphviz

    - name: Generate Graph
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        # Create temporary directory for graph generation (preserve existing .terraform)
        GRAPH_TEMP=$(mktemp -d)
        echo "Using temp directory: $GRAPH_TEMP"
        
        # Copy Terraform files to temp (excluding state and providers)
        find . -name '*.tf' -exec cp --parents {} "$GRAPH_TEMP/" \; 2>/dev/null || true
        
        # Move to temp directory
        cd "$GRAPH_TEMP"
        
        # Remove backend configuration for local graph generation
        sed -i '/^terraform {/,/^}/{ /backend/,/}/d }' *.tf 2>/dev/null || true
        
        # Initialize without backend
        terraform init -backend=false -input=false
        
        # Generate the graph
        terraform graph > graph.dot
        dot -T${{ inputs.output_format }} graph.dot -o terraform-graph.${{ inputs.output_format }}
        
        # Copy result back to original directory
        cp terraform-graph.${{ inputs.output_format }} "$OLDPWD/"
        cp graph.dot "$OLDPWD/"
        
        # Cleanup temp
        rm -rf "$GRAPH_TEMP"
        
        echo "## 🗺️ Infrastructure Graph" >> $GITHUB_STEP_SUMMARY
        echo "Graph generated successfully. Download from artifacts." >> $GITHUB_STEP_SUMMARY

    - name: Upload Graph
      uses: actions/upload-artifact@v4
      with:
        name: terraform-graph
        path: ${{ inputs.working_directory }}/terraform-graph.${{ inputs.output_format }}
        retention-days: 30
