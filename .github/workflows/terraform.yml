# =============================================================================
# TERRAFORM UNIFIED PIPELINE - Azure Landing Zone
# =============================================================================
# Single pipeline for ALL Terraform operations:
# - Push/PR: Format, validate, security scan, plan
# - Manual: Plan, apply, destroy (single environment)
# - Matrix: Multi-environment parallel deployments
# - Drift: Scheduled drift detection (daily at 6 AM UTC)
# =============================================================================

name: 'Terraform Pipeline'

on:
  # Code changes trigger validation and planning
  push:
    branches: [main]
    paths: ['**.tf', '**.tfvars', 'modules/**', 'landing-zones/**', 'environments/**']
  pull_request:
    branches: [main]
    paths: ['**.tf', '**.tfvars']
  
  # Scheduled drift detection (daily at 6 AM UTC)
  schedule:
    - cron: '0 6 * * *'
  
  # Manual trigger for all operations
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline Mode'
        required: true
        default: 'single'
        type: choice
        options:
          - single        # Single environment deployment
          - matrix        # Multi-environment parallel deployment
          - drift         # Drift detection only
          - rollback      # Restore previous state
          - audit         # Generate compliance report only
          - validate-only # Full validation without apply
      environment:
        description: 'Environment (single mode)'
        required: false
        default: 'lab'
        type: choice
        options: [dev, lab, staging, prod]
      environments:
        description: 'Environments (matrix mode, comma-separated)'
        required: false
        default: 'dev,staging,prod'
        type: string
      action:
        description: 'Action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      destroy_confirm:
        description: 'Type DESTROY to confirm'
        required: false
        type: string
      working_directory:
        description: 'Working directory'
        required: false
        default: '.'
        type: string
      create_drift_issue:
        description: 'Create issue on drift (drift mode)'
        required: false
        default: true
        type: boolean
  
  # Reusable workflow support
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: string
      action:
        description: 'Action (plan, apply, destroy)'
        required: false
        type: string
        default: 'plan'
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.9.0'
      working_directory:
        description: 'Working directory'
        required: false
        type: string
        default: '.'
    secrets:
      AZURE_CREDENTIALS:
        required: false
      TF_STATE_RG:
        required: true
      TF_STATE_SA:
        required: true
      INFRACOST_API_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: false

concurrency:
  group: terraform-${{ github.ref }}-${{ inputs.environment || github.event.inputs.environment || github.event.inputs.mode || 'default' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  security-events: write
  id-token: write
  issues: write

env:
  TF_VERSION: ${{ inputs.terraform_version || vars.TF_VERSION || '1.9.0' }}
  ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment || 'lab' }}
  WORKING_DIRECTORY: ${{ inputs.working_directory || github.event.inputs.working_directory || vars.TF_WORKING_DIRECTORY || '.' }}
  # Pipeline Mode Detection
  PIPELINE_MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'drift') || 'single' }}
  # OIDC Configuration (set USE_OIDC=true in repo variables to enable)
  USE_OIDC: ${{ vars.USE_OIDC || 'false' }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Performance Tuning
  TF_PARALLELISM: '20'
  TF_LOCK_TIMEOUT: '10m'
  # Blast Radius Threshold (alert if destroy count exceeds)
  BLAST_RADIUS_THRESHOLD: '10'
  # Change Freeze Window (UTC) - block deployments during weekends
  # Set ENABLE_FREEZE_WINDOW=true in repo variables to enable
  ENABLE_FREEZE_WINDOW: ${{ vars.ENABLE_FREEZE_WINDOW || 'false' }}
  # Audit Log destination
  LOG_ANALYTICS_WORKSPACE_ID: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID || '' }}

jobs:
  # =========================================================================
  # STAGE 0: MODE ROUTER - Determines which jobs to run
  # =========================================================================
  router:
    name: 'Route Pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      is_drift: ${{ steps.detect.outputs.is_drift }}
      is_matrix: ${{ steps.detect.outputs.is_matrix }}
      is_single: ${{ steps.detect.outputs.is_single }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Detect Pipeline Mode
        id: detect
        run: |
          MODE="${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'drift') || 'single' }}"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "is_drift=$([[ '$MODE' == 'drift' ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "is_matrix=$([[ '$MODE' == 'matrix' ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "is_single=$([[ '$MODE' == 'single' || '${{ github.event_name }}' == 'push' || '${{ github.event_name }}' == 'pull_request' ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          
          echo "## 🔀 Pipeline Mode: $MODE" >> $GITHUB_STEP_SUMMARY
          echo "- Event: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual/Push/PR' }}" >> $GITHUB_STEP_SUMMARY

      - name: Setup Matrix
        id: matrix
        if: github.event.inputs.mode == 'matrix'
        run: |
          ENVS="${{ github.event.inputs.environments || 'dev,staging,prod' }}"
          JSON_ARRAY=$(echo "$ENVS" | tr ',' '\n' | jq -R . | jq -s .)
          echo "matrix={\"environment\":$JSON_ARRAY}" >> $GITHUB_OUTPUT
          echo "### Matrix Environments:" >> $GITHUB_STEP_SUMMARY
          echo "$ENVS" | tr ',' '\n' | while read env; do echo "- $env"; done >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 0B: REPO HYGIENE (Optional)
  # =========================================================================
  repo-hygiene:
    name: 'Repo Hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: router
    if: vars.ENABLE_REPO_HYGIENE == 'true' && needs.router.outputs.is_drift != 'true'
    steps:
      - name: Check Branch Protection
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          API="https://api.github.com/repos/${{ github.repository }}"
          DEFAULT_BRANCH=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API" | jq -r '.default_branch // "main"')
          STATUS=$(curl -s -o /tmp/branch-protection.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$API/branches/$DEFAULT_BRANCH/protection")
          
          echo "## ?? Repo Hygiene" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Default branch: **$DEFAULT_BRANCH**" >> $GITHUB_STEP_SUMMARY
          
          if [ "$STATUS" != "200" ]; then
            echo "?? Branch protection not readable (HTTP $STATUS). Configure repo permissions or branch protection." >> $GITHUB_STEP_SUMMARY
            if [ "${{ vars.FAIL_ON_REPO_HYGIENE }}" == "true" ]; then
              exit 1
            fi
            exit 0
          fi
          
          REVIEWS=$(jq -r '.required_pull_request_reviews != null' /tmp/branch-protection.json)
          CHECKS=$(jq -r '.required_status_checks != null' /tmp/branch-protection.json)
          
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Required PR reviews | $REVIEWS |" >> $GITHUB_STEP_SUMMARY
          echo "| Required status checks | $CHECKS |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$REVIEWS" != "true" ] || [ "$CHECKS" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "?? Missing recommended protections on $DEFAULT_BRANCH" >> $GITHUB_STEP_SUMMARY
            if [ "${{ vars.FAIL_ON_REPO_HYGIENE }}" == "true" ]; then
              exit 1
            fi
          fi

  # =========================================================================
  # STAGE 1: FORMAT CHECK (Skip for drift mode)
  # =========================================================================
  format:
    name: '1. Format Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: router
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format Check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if ! terraform fmt -check -recursive -diff; then
            echo "## ❌ Format Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "Run \`terraform fmt -recursive\` locally to fix." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Format Check Passed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 2: VALIDATE (Skip for drift mode)
  # =========================================================================
  validate:
    name: '2. Validate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, format]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init -backend=false
          terraform validate
          echo "## ✅ Validation Passed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 2B: TERRAFORM TESTS (Skip for drift mode)
  # =========================================================================
  terraform-tests:
    name: '2a. Terraform Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Test
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "## ?? Terraform Tests" >> $GITHUB_STEP_SUMMARY
          if [ "${{ vars.ENABLE_TERRAFORM_TESTS }}" == "false" ]; then
            echo "Disabled via ENABLE_TERRAFORM_TESTS=false; skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          TEST_FILES=$(find . -name "*.tftest.hcl" -o -name "*.tftest.json" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$TEST_FILES" -eq 0 ]; then
            echo "No .tftest files found; skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          terraform init -backend=false
          terraform test -no-color
          echo "? Terraform tests passed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 2C: MODULE CONTRACT CHECKS (Optional)
  # =========================================================================
  module-contracts:
    name: '2b. Module Contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Module Contracts
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "## ?? Module Contract Checks" >> $GITHUB_STEP_SUMMARY
          if [ "${{ vars.ENABLE_MODULE_CONTRACTS }}" != "true" ]; then
            echo "ENABLE_MODULE_CONTRACTS not enabled; skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ ! -d "modules" ]; then
            echo "No modules/ directory found; skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          FAIL=0
          for mod in modules/*/; do
            [ -d "$mod" ] || continue
            NAME=$(basename "$mod")
            echo "### Module: $NAME" >> $GITHUB_STEP_SUMMARY
            
            if [ ! -f "${mod}variables.tf" ]; then
              echo "- ?? Missing variables.tf" >> $GITHUB_STEP_SUMMARY
              FAIL=1
            fi
            if [ ! -f "${mod}outputs.tf" ]; then
              echo "- ?? Missing outputs.tf" >> $GITHUB_STEP_SUMMARY
              FAIL=1
            fi
            if [ ! -f "${mod}README.md" ]; then
              echo "- ?? Missing README.md" >> $GITHUB_STEP_SUMMARY
              FAIL=1
            fi
            
            if [ -f "${mod}variables.tf" ]; then
              MISSING_DESC=$(awk '
                /^variable[[:space:]]+"/ {invar=1; desc=0}
                invar && /description[[:space:]]*=/ {desc=1}
                /^}/ {if (invar && desc==0) missing++; invar=0}
                END {print missing+0}
              ' "${mod}variables.tf")
              if [ "$MISSING_DESC" -gt 0 ]; then
                echo "- ?? $MISSING_DESC variable(s) missing description" >> $GITHUB_STEP_SUMMARY
                FAIL=1
              else
                echo "- ? Variable descriptions present" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          
          if [ "$FAIL" -eq 1 ]; then
            if [ "${{ vars.FAIL_ON_MODULE_CONTRACTS }}" == "true" ]; then
              exit 1
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "?? Contract issues found; set FAIL_ON_MODULE_CONTRACTS=true to enforce." >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # STAGE 3: SECURITY - TFSEC (Skip for drift mode)
  # =========================================================================
  security-tfsec:
    name: '3. Security - tfsec'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}
          soft_fail: true
          format: sarif
          additional_args: --out tfsec-results.sarif
        continue-on-error: true

      - name: Upload tfsec SARIF
        if: always()
        shell: bash
        run: |
          if [ -f tfsec-results.sarif ]; then
            echo "tfsec SARIF exists; uploading."
          else
            echo "tfsec SARIF not found; skipping upload."
          fi

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('tfsec-results.sarif') != ''
        with:
          sarif_file: tfsec-results.sarif
        continue-on-error: true

      - run: echo "## 🔒 tfsec scan completed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 3: SECURITY - CHECKOV (Skip for drift mode)
  # =========================================================================
  security-checkov:
    name: '3a. Security - Checkov'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIRECTORY }}
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
        continue-on-error: true

      - run: echo "## 🛡️ Checkov scan completed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 3: SECURITY - TERRASCAN (Optional)
  # =========================================================================
  security-terrascan:
    name: '3b. Security - Terrascan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Terrascan
        if: vars.ENABLE_TERRASCAN == 'true'
        shell: bash
        run: |
          VERSION="${{ vars.TERRASCAN_VERSION || '1.18.3' }}"
          curl -sSL "https://github.com/tenable/terrascan/releases/download/v${VERSION}/terrascan_${VERSION}_Linux_x86_64.tar.gz" | tar -xz
          chmod +x terrascan
          sudo mv terrascan /usr/local/bin/
          terrascan version

      - name: Run Terrascan
        if: vars.ENABLE_TERRASCAN == 'true'
        shell: bash
        run: |
          set +e
          terrascan scan -i terraform -d "${{ env.WORKING_DIRECTORY }}" -o sarif > terrascan.sarif
          EXITCODE=$?
          if [ $EXITCODE -ne 0 ]; then
            echo "?? Terrascan reported findings" >> $GITHUB_STEP_SUMMARY
          fi
          echo "## ?? Terrascan scan completed" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Terrascan Skipped
        if: vars.ENABLE_TERRASCAN != 'true'
        shell: bash
        run: |
          echo "## ?? Terrascan scan skipped (ENABLE_TERRASCAN not set)" >> $GITHUB_STEP_SUMMARY

      - uses: github/codeql-action/upload-sarif@v4
        if: vars.ENABLE_TERRASCAN == 'true' && hashFiles('terrascan.sarif') != ''
        with:
          sarif_file: terrascan.sarif
        continue-on-error: true

  # =========================================================================
  # STAGE 3: SECRET SCANNING (Skip for drift mode)
  # =========================================================================
  secret-scan:
    name: '3c. Security - Secrets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for secret scanning

      - uses: ./.github/actions/secret-scan

  # =========================================================================
  # STAGE 3: SHELLCHECK - Script Security (Skip for drift mode)
  # =========================================================================
  shellcheck:
    name: '3d. Security - Scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on Composite Actions
        run: |
          echo "## 🐚 ShellCheck Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Find all bash scripts in actions
          SCRIPTS=$(find .github/actions -name "*.sh" 2>/dev/null || true)
          
          # Also extract inline bash from action.yml files
          ERRORS=0
          for action in .github/actions/*/action.yml; do
            ACTION_NAME=$(dirname "$action" | xargs basename)
            
            # Extract shell script blocks and check them
            grep -Pzo '(?s)run: \|\n\s+.*?(?=\n\s+-|\n\s+[a-z]+:|$)' "$action" 2>/dev/null | \
              tr '\0' '\n' | sed 's/^run: |//' > /tmp/script_$ACTION_NAME.sh 2>/dev/null || true
            
            if [ -s "/tmp/script_$ACTION_NAME.sh" ]; then
              if ! shellcheck -S warning /tmp/script_$ACTION_NAME.sh 2>/dev/null; then
                echo "⚠️ Issues found in: $ACTION_NAME" >> $GITHUB_STEP_SUMMARY
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          
          if [ $ERRORS -eq 0 ]; then
            echo "✅ No critical shell script issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Found issues in $ERRORS action(s) - review recommended" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  # =========================================================================
  # STAGE 4: TFLINT (Skip for drift mode)
  # =========================================================================
  tflint:
    name: '4. Lint - TFLint'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cat > .tflint.hcl << 'EOF'
          plugin "azurerm" {
            enabled = true
            version = "0.27.0"
            source  = "github.com/terraform-linters/tflint-ruleset-azurerm"
          }
          EOF
          tflint --init
          echo "## 📏 TFLint Results" >> $GITHUB_STEP_SUMMARY
          tflint --recursive || true
        continue-on-error: true

  # =========================================================================
  # STAGE 4: POLICY CHECK (Skip for drift mode)
  # =========================================================================
  policy-check:
    name: '4a. Lint - Policy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init for Policy Check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -backend=false

      - uses: ./.github/actions/policy-check
        with:
          policy_dir: policies
          soft_fail: 'true'
          working_directory: ${{ env.WORKING_DIRECTORY }}

  # =========================================================================
  # STAGE 4: TERRAFORM DOCS (Skip for drift mode)
  # =========================================================================
  terraform-docs:
    name: '4b. Lint - Docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/terraform-docs
        with:
          recursive: 'true'
          working_directory: ${{ env.WORKING_DIRECTORY }}

  # =========================================================================
  # STAGE 4B: TERRAFORM DOCS CHECK (Optional)
  # =========================================================================
  docs-check:
    name: '4c. Docs Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/terraform-docs
        if: vars.DOCS_ENFORCE == 'true'
        with:
          recursive: 'true'
          working_directory: ${{ env.WORKING_DIRECTORY }}

      - name: Verify Docs Are Up To Date
        if: vars.DOCS_ENFORCE == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "## ?? Terraform Docs Check" >> $GITHUB_STEP_SUMMARY
            echo "? Docs are up to date" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## ?? Terraform Docs Check" >> $GITHUB_STEP_SUMMARY
          echo "? Docs are out of date. Run terraform-docs and commit changes." >> $GITHUB_STEP_SUMMARY
          git status --short >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Docs Check Skipped
        if: vars.DOCS_ENFORCE != 'true'
        shell: bash
        run: |
          echo "## ?? Terraform Docs Check" >> $GITHUB_STEP_SUMMARY
          echo "Docs enforcement disabled (DOCS_ENFORCE not set)." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 4E: AZURE POLICY PRE-CHECK (Optional)
  # =========================================================================
  azure-policy-check:
    name: '4e. Compliance - Azure Policy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, validate]
    if: needs.router.outputs.is_drift != 'true' && vars.ENABLE_AZURE_POLICY_CHECK == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure Login (OIDC)
        if: env.USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Legacy)
        if: env.USE_OIDC != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Azure Policy Compliance
        shell: bash
        run: |
          echo "## 📋 Azure Policy Pre-Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get subscription-level policy compliance
          SUBSCRIPTION_ID="${{ env.AZURE_SUBSCRIPTION_ID }}"
          if [ -z "$SUBSCRIPTION_ID" ]; then
            SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          fi
          
          echo "### Current Policy Compliance Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get non-compliant resources count
          NON_COMPLIANT=$(az policy state summarize --subscription "$SUBSCRIPTION_ID" \
            --query "results.nonCompliantResources" -o tsv 2>/dev/null || echo "0")
          
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Non-Compliant Resources | $NON_COMPLIANT |" >> $GITHUB_STEP_SUMMARY
          
          # List policy assignments
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Active Policy Assignments" >> $GITHUB_STEP_SUMMARY
          az policy assignment list --query "[].{Name:displayName,Scope:scope}" -o table >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Unable to list assignments" >> $GITHUB_STEP_SUMMARY
          
          # Check for deny policies that might block deployment
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deny Policies (may block deployment)" >> $GITHUB_STEP_SUMMARY
          az policy assignment list --query "[?enforcementMode=='Default'].displayName" -o tsv 2>/dev/null | head -10 >> $GITHUB_STEP_SUMMARY || echo "None found" >> $GITHUB_STEP_SUMMARY
          
          if [ "$NON_COMPLIANT" -gt "${{ vars.POLICY_COMPLIANCE_THRESHOLD || 10 }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ High number of non-compliant resources detected" >> $GITHUB_STEP_SUMMARY
            if [ "${{ vars.FAIL_ON_POLICY_CHECK }}" == "true" ]; then
              exit 1
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Policy compliance within threshold" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Azure Policy Check Skipped
        if: vars.ENABLE_AZURE_POLICY_CHECK != 'true'
        shell: bash
        run: |
          echo "## 📋 Azure Policy Pre-Check" >> $GITHUB_STEP_SUMMARY
          echo "Skipped (ENABLE_AZURE_POLICY_CHECK not set)" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 5: GRAPH VISUALIZATION (Skip for drift mode)
  # =========================================================================
  graph:
    name: '5. Analysis - Graph'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, security-tfsec, security-checkov, security-terrascan, secret-scan, shellcheck, tflint, policy-check]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: ./.github/actions/graph
        with:
          output_format: svg
          working_directory: ${{ env.WORKING_DIRECTORY }}

  # =========================================================================
  # STAGE 5: MODULE VERSION CHECK (Skip for drift mode)
  # =========================================================================
  module-versions:
    name: '5a. Analysis - Module Versions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, security-tfsec, security-checkov, security-terrascan, secret-scan, shellcheck, tflint, policy-check]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -backend=false

      - uses: ./.github/actions/module-version
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}

  # =========================================================================
  # STAGE 5B: BLAST RADIUS VISUALIZATION (Optional)
  # =========================================================================
  blast-radius:
    name: '5b. Analysis - Blast Radius'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, graph, module-versions]
    if: needs.router.outputs.is_drift != 'true' && vars.ENABLE_BLAST_RADIUS == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install graphviz pydot networkx
          sudo apt-get update && sudo apt-get install -y graphviz

      - name: Init Terraform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -backend=false

      - name: Generate Blast Radius Visualization
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "## 💥 Blast Radius Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Generate terraform graph
          terraform graph -type=plan > graph.dot 2>/dev/null || terraform graph > graph.dot
          
          # Convert to multiple formats
          dot -Tsvg graph.dot -o blast-radius.svg 2>/dev/null || true
          dot -Tpng graph.dot -o blast-radius.png 2>/dev/null || true
          
          # Count resources and dependencies
          RESOURCES=$(grep -c '\[label=' graph.dot 2>/dev/null || echo "0")
          EDGES=$(grep -c '\->' graph.dot 2>/dev/null || echo "0")
          
          echo "### Resource Dependency Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Resources/Nodes | $RESOURCES |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies/Edges | $EDGES |" >> $GITHUB_STEP_SUMMARY
          
          # Identify high-impact resources (many dependencies)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### High-Impact Resources (most dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep '\->' graph.dot | cut -d'"' -f2 | sort | uniq -c | sort -rn | head -10 | \
            while read count resource; do
              echo "- **$resource**: $count dependencies" >> $GITHUB_STEP_SUMMARY
            done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Blast radius visualization generated" >> $GITHUB_STEP_SUMMARY

      - name: Upload Blast Radius Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blast-radius-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/blast-radius.svg
            ${{ env.WORKING_DIRECTORY }}/blast-radius.png
            ${{ env.WORKING_DIRECTORY }}/graph.dot
          retention-days: 30
        continue-on-error: true

  # =========================================================================
  # STAGE 5C: RESOURCE DEPENDENCY MAP (Optional)
  # =========================================================================
  resource-dependency-map:
    name: '5c. Analysis - Dependency Map'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, graph, module-versions]
    if: needs.router.outputs.is_drift != 'true' && vars.ENABLE_DEPENDENCY_MAP == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init Terraform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -backend=false

      - name: Generate Resource Dependency Report
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          echo "## 🗺️ Resource Dependency Map" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Generate graph in JSON-like format for parsing
          terraform graph -type=plan > deps.dot 2>/dev/null || terraform graph > deps.dot
          
          # Create dependency report
          cat > dependency-report.json << 'JSONEOF'
          {
            "generated_at": "$(date -Iseconds)",
            "commit": "${{ github.sha }}",
            "resources": []
          }
          JSONEOF
          
          echo "### Module Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # List modules and their dependencies
          if [ -d "modules" ]; then
            for mod in modules/*/; do
              [ -d "$mod" ] || continue
              MOD_NAME=$(basename "$mod")
              echo "#### Module: $MOD_NAME" >> $GITHUB_STEP_SUMMARY
              
              # Count resources in module
              TF_FILES=$(find "$mod" -name "*.tf" 2>/dev/null | wc -l)
              RESOURCES=$(grep -h "^resource " "$mod"*.tf 2>/dev/null | wc -l || echo "0")
              DATA_SOURCES=$(grep -h "^data " "$mod"*.tf 2>/dev/null | wc -l || echo "0")
              
              echo "- Terraform files: $TF_FILES" >> $GITHUB_STEP_SUMMARY
              echo "- Resources: $RESOURCES" >> $GITHUB_STEP_SUMMARY
              echo "- Data sources: $DATA_SOURCES" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No modules/ directory found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Provider Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform providers 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "Could not list providers" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resource Type Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count resources by type
          grep -rh "^resource " *.tf modules/**/*.tf 2>/dev/null | \
            sed 's/resource "\([^"]*\)".*/\1/' | sort | uniq -c | sort -rn | head -15 | \
            while read count type; do
              echo "- \`$type\`: $count" >> $GITHUB_STEP_SUMMARY
            done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency map generated" >> $GITHUB_STEP_SUMMARY

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-map-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/deps.dot
            ${{ env.WORKING_DIRECTORY }}/dependency-report.json
          retention-days: 30
        continue-on-error: true

  # =========================================================================
  # STAGE 6: COST ESTIMATION (Skip for drift mode)
  # =========================================================================
  cost-estimate:
    name: '6. Analysis - Cost'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, graph, module-versions, terraform-tests, module-contracts, docs-check]
    if: needs.router.outputs.is_drift != 'true' && needs.router.outputs.is_matrix != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -backend=false

      - uses: ./.github/actions/cost-estimate
        with:
          api_key: ${{ secrets.INFRACOST_API_KEY }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          var_file: environments/${{ env.ENVIRONMENT }}.tfvars
          cost_threshold: ${{ vars.COST_THRESHOLD || '500' }}
          cost_increase_threshold: ${{ vars.COST_INCREASE_THRESHOLD || '100' }}
          save_baseline: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true

  # =========================================================================
  # STAGE 6B: VERSION CHECK (Skip for drift mode)
  # =========================================================================
  version-check:
    name: '6a. Analysis - Provider Versions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, graph, module-versions]
    if: needs.router.outputs.is_drift != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/version-check
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          check_cves: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # STAGE 7: PLAN (Skip for drift mode - uses drift-detect instead)
  # =========================================================================
  plan:
    name: '7. Plan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [router, graph, module-versions, terraform-tests, module-contracts, docs-check]
    if: needs.router.outputs.is_drift != 'true' && needs.router.outputs.is_matrix != 'true'
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      add: ${{ steps.plan.outputs.add }}
      change: ${{ steps.plan.outputs.change }}
      destroy: ${{ steps.plan.outputs.destroy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Plan
        id: plan
        uses: ./.github/actions/plan
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          # OIDC Authentication (recommended)
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          # Legacy Authentication (fallback)
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          # Backend Configuration
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate
          var_file: environments/${{ env.ENVIRONMENT }}.tfvars
          environment: ${{ env.ENVIRONMENT }}
          # Performance Tuning
          parallelism: ${{ env.TF_PARALLELISM }}
          lock_timeout: ${{ env.TF_LOCK_TIMEOUT }}

      - name: Blast Radius Check
        if: steps.plan.outputs.destroy != '' && steps.plan.outputs.destroy != '0'
        run: |
          DESTROY_COUNT=${{ steps.plan.outputs.destroy }}
          THRESHOLD=${{ env.BLAST_RADIUS_THRESHOLD }}
          if [ "$DESTROY_COUNT" -ge "$THRESHOLD" ]; then
            echo "## ⚠️ BLAST RADIUS WARNING" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This plan will **destroy $DESTROY_COUNT resources** which exceeds the threshold of $THRESHOLD." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔴 **Manual review required before apply.**" >> $GITHUB_STEP_SUMMARY
            echo "::warning::High blast radius detected: $DESTROY_COUNT resources will be destroyed"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/pr-comment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plan_add: ${{ steps.plan.outputs.add }}
          plan_change: ${{ steps.plan.outputs.change }}
          plan_destroy: ${{ steps.plan.outputs.destroy }}
          plan_file: ${{ env.WORKING_DIRECTORY }}/plan_output.txt
          collapse_plan: 'true'

  # =========================================================================
  # STAGE 7A: TAGGING AUDIT (Optional)
  # =========================================================================
  tag-audit:
    name: '7a. Tag Audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, plan]
    if: needs.router.outputs.is_drift != 'true' && needs.router.outputs.is_matrix != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}

      - name: Audit Required Tags
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          REQUIRED="${{ vars.REQUIRED_TAG_KEYS }}"
          echo "## ?? Tag Audit" >> $GITHUB_STEP_SUMMARY
          if [ -z "$REQUIRED" ]; then
            echo "No REQUIRED_TAG_KEYS set; skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ ! -f "tfplan.json" ]; then
            echo "::error::tfplan.json not found in plan artifact" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          IFS=',' read -ra TAGS <<< "$REQUIRED"
          MISSING_TOTAL=0
          
          for raw in "${TAGS[@]}"; do
            TAG=$(echo "$raw" | xargs)
            [ -n "$TAG" ] || continue
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Required Tag: $TAG" >> $GITHUB_STEP_SUMMARY
            
            MISSING=$(jq -r --arg tag "$TAG" '
              .resource_changes[]
              | select(.change.after != null)
              | select(.change.after.tags? != null)
              | select(.change.after.tags[$tag] == null)
              | .address
            ' tfplan.json)
            
            if [ -z "$MISSING" ]; then
              echo "- ? All tagged resources include $TAG" >> $GITHUB_STEP_SUMMARY
            else
              COUNT=$(echo "$MISSING" | wc -l | tr -d " ")
              MISSING_TOTAL=$((MISSING_TOTAL + COUNT))
              echo "- ?? $COUNT resource(s) missing $TAG" >> $GITHUB_STEP_SUMMARY
              echo "$MISSING" | sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          if [ "$MISSING_TOTAL" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "?? Tag audit found missing required tags." >> $GITHUB_STEP_SUMMARY
            if [ "${{ vars.FAIL_ON_TAG_AUDIT }}" == "true" ]; then
              exit 1
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "? Tag audit passed" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # STAGE 7E: DEPENDENCY HEALTH CHECK (Optional)
  # =========================================================================
  dependency-health-check:
    name: '7e. Dependency Health Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, plan]
    if: needs.router.outputs.is_drift != 'true' && vars.ENABLE_DEPENDENCY_CHECK == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure Login (OIDC)
        if: env.USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Legacy)
        if: env.USE_OIDC != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check External Dependencies
        shell: bash
        run: |
          echo "## 🔗 Dependency Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          FAIL_COUNT=0
          
          # Check Azure Management API
          echo "### Azure Services Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check Azure Status API
          AZURE_STATUS=$(curl -sf --max-time 10 "https://status.azure.com/en-us/status" -o /dev/null && echo "✅ Healthy" || echo "⚠️ Unreachable")
          echo "- Azure Status Page: $AZURE_STATUS" >> $GITHUB_STEP_SUMMARY
          
          # Check Azure Management endpoint
          MGMT_STATUS=$(curl -sf --max-time 10 "https://management.azure.com/tenants?api-version=2020-01-01" -H "Authorization: Bearer $(az account get-access-token --query accessToken -o tsv 2>/dev/null)" -o /dev/null && echo "✅ Healthy" || echo "⚠️ Check Failed")
          echo "- Azure Management API: $MGMT_STATUS" >> $GITHUB_STEP_SUMMARY
          
          # Check Terraform Registry
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Terraform Registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          REGISTRY_STATUS=$(curl -sf --max-time 10 "https://registry.terraform.io/.well-known/terraform.json" -o /dev/null && echo "✅ Healthy" || echo "⚠️ Unreachable")
          echo "- Terraform Registry: $REGISTRY_STATUS" >> $GITHUB_STEP_SUMMARY
          
          # Check AzureRM provider availability
          AZURERM_STATUS=$(curl -sf --max-time 10 "https://registry.terraform.io/v1/providers/hashicorp/azurerm" -o /dev/null && echo "✅ Available" || echo "⚠️ Unreachable")
          echo "- AzureRM Provider: $AZURERM_STATUS" >> $GITHUB_STEP_SUMMARY
          
          # DNS Resolution checks
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DNS Resolution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for endpoint in management.azure.com login.microsoftonline.com blob.core.windows.net; do
            if nslookup $endpoint > /dev/null 2>&1; then
              echo "- $endpoint: ✅ Resolved" >> $GITHUB_STEP_SUMMARY
            else
              echo "- $endpoint: ⚠️ Resolution Failed" >> $GITHUB_STEP_SUMMARY
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done
          
          # Check current Azure subscription status
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Subscription Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          SUB_STATE=$(az account show --query state -o tsv 2>/dev/null || echo "Unknown")
          echo "- Subscription State: $SUB_STATE" >> $GITHUB_STEP_SUMMARY
          
          if [ "$SUB_STATE" != "Enabled" ]; then
            echo "⚠️ Subscription is not in Enabled state!" >> $GITHUB_STEP_SUMMARY
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "⚠️ $FAIL_COUNT dependency check(s) failed" >> $GITHUB_STEP_SUMMARY
            if [ "${{ vars.FAIL_ON_DEPENDENCY_CHECK }}" == "true" ]; then
              exit 1
            fi
          else
            echo "✅ All dependency checks passed" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # STAGE 7F: QUOTA VALIDATION (Optional)
  # =========================================================================
  quota-validation:
    name: '7f. Quota Validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, plan]
    if: needs.router.outputs.is_drift != 'true' && vars.ENABLE_QUOTA_CHECK == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure Login (OIDC)
        if: env.USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Legacy)
        if: env.USE_OIDC != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true

      - name: Check Azure Quotas
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "## 📊 Azure Quota Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          LOCATION="${{ vars.AZURE_LOCATION || 'eastus2' }}"
          
          echo "### Compute Quotas (Location: $LOCATION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check VM quotas
          echo "| Quota | Current | Limit | Usage % |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|-------|---------|" >> $GITHUB_STEP_SUMMARY
          
          az vm list-usage --location "$LOCATION" --query "[?currentValue > 0 || name.value=='cores' || name.value=='virtualMachines'].{Name:name.localizedValue,Current:currentValue,Limit:limit}" -o json 2>/dev/null | \
            jq -r '.[] | select(.Limit > 0) | "| \(.Name) | \(.Current) | \(.Limit) | \((.Current / .Limit * 100) | floor)% |"' >> $GITHUB_STEP_SUMMARY || echo "Unable to fetch VM quotas" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Network Quotas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Quota | Current | Limit | Usage % |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|-------|---------|" >> $GITHUB_STEP_SUMMARY
          
          az network list-usages --location "$LOCATION" --query "[?currentValue > 0].{Name:name.localizedValue,Current:currentValue,Limit:limit}" -o json 2>/dev/null | \
            jq -r '.[] | select(.Limit > 0) | "| \(.Name) | \(.Current) | \(.Limit) | \((.Current / .Limit * 100) | floor)% |"' | head -10 >> $GITHUB_STEP_SUMMARY || echo "Unable to fetch network quotas" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Storage Quotas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count current storage accounts
          SA_COUNT=$(az storage account list --query "length(@)" -o tsv 2>/dev/null || echo "0")
          SA_LIMIT=250  # Default Azure limit
          SA_USAGE=$((SA_COUNT * 100 / SA_LIMIT))
          
          echo "| Quota | Current | Limit | Usage % |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Storage Accounts | $SA_COUNT | $SA_LIMIT | $SA_USAGE% |" >> $GITHUB_STEP_SUMMARY
          
          # Check for high utilization
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quota Warnings" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          THRESHOLD="${{ vars.QUOTA_WARNING_THRESHOLD || '80' }}"
          WARNING_COUNT=0
          
          az vm list-usage --location "$LOCATION" -o json 2>/dev/null | \
            jq -r ".[] | select(.limit > 0) | select((.currentValue / .limit * 100) > $THRESHOLD) | \"⚠️ \(.name.localizedValue): \(.currentValue)/\(.limit) (\((.currentValue / .limit * 100) | floor)%)\"" | \
            while read line; do
              echo "$line" >> $GITHUB_STEP_SUMMARY
              WARNING_COUNT=$((WARNING_COUNT + 1))
            done
          
          if [ "$WARNING_COUNT" -eq 0 ]; then
            echo "✅ All quotas are below ${THRESHOLD}% utilization" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # STAGE 7B: INTEGRATION TESTS (PR only)
  # =========================================================================
  integration-tests:
    name: '7d. Integration Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/terratest
        with:
          test_directory: tests
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          environment: ${{ env.ENVIRONMENT }}
          timeout: '30m'
          output_format: 'junit'
        continue-on-error: true

  # =========================================================================
  # STAGE 7C: EPHEMERAL PR ENVIRONMENT (Optional)
  # =========================================================================
  ephemeral-env:
    name: '7b. Ephemeral PR Environment'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [router, plan]
    if: |
      github.event_name == 'pull_request' &&
      needs.router.outputs.is_drift != 'true' &&
      vars.ENABLE_EPHEMERAL_ENV == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Ephemeral Config
        id: config
        shell: bash
        run: |
          VAR_FILE="${{ vars.EPHEMERAL_VAR_FILE }}"
          if [ -z "$VAR_FILE" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "## ?? Ephemeral Environment" >> $GITHUB_STEP_SUMMARY
            echo "EPHEMERAL_VAR_FILE not set; skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          if [ ! -f "${{ env.WORKING_DIRECTORY }}/$VAR_FILE" ]; then
            echo "## ?? Ephemeral Environment" >> $GITHUB_STEP_SUMMARY
            echo "::error::Ephemeral var file not found: $VAR_FILE" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          ENV_NAME="ephemeral-pr-${{ github.event.pull_request.number }}"
          STATE_KEY="${ENV_NAME}.terraform.tfstate"
          
          echo "enabled=true" >> $GITHUB_OUTPUT
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "var_file=$VAR_FILE" >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT

      - name: Ephemeral Plan
        id: plan
        if: steps.config.outputs.enabled == 'true'
        uses: ./.github/actions/plan
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ steps.config.outputs.state_key }}
          var_file: ${{ steps.config.outputs.var_file }}
          environment: ${{ steps.config.outputs.env_name }}
          parallelism: ${{ env.TF_PARALLELISM }}
          lock_timeout: ${{ env.TF_LOCK_TIMEOUT }}

      - name: Ephemeral Apply
        if: steps.config.outputs.enabled == 'true'
        uses: ./.github/actions/apply
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ steps.config.outputs.state_key }}
          environment: ${{ steps.config.outputs.env_name }}
          plan_artifact: tfplan-${{ steps.config.outputs.env_name }}-${{ github.sha }}
          parallelism: ${{ env.TF_PARALLELISM }}
          lock_timeout: ${{ env.TF_LOCK_TIMEOUT }}

      - name: Ephemeral Smoke Test
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "## ?? Ephemeral Smoke Test" >> $GITHUB_STEP_SUMMARY
          terraform state list 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY || true
        continue-on-error: true

      - name: Ephemeral Destroy
        if: always() && steps.config.outputs.enabled == 'true'
        uses: ./.github/actions/destroy
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ steps.config.outputs.state_key }}
          var_file: ${{ steps.config.outputs.var_file }}
          environment: ${{ steps.config.outputs.env_name }}
          confirm: 'DESTROY'
          parallelism: ${{ env.TF_PARALLELISM }}

  # =========================================================================
  # STAGE 7D: CANARY APPLY (Optional, before prod)
  # =========================================================================
  canary:
    name: '7c. Canary Apply'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [router, plan]
    if: |
      needs.router.outputs.mode == 'single' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'apply'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Canary Config
        id: canary
        shell: bash
        run: |
          if [ "${{ vars.ENABLE_CANARY }}" != "true" ] || [ "${{ env.ENVIRONMENT }}" != "prod" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "## ?? Canary Apply" >> $GITHUB_STEP_SUMMARY
            echo "Canary not enabled or target environment is not prod; skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          ENV_NAME="${{ vars.CANARY_ENVIRONMENT }}"
          if [ -z "$ENV_NAME" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "## ?? Canary Apply" >> $GITHUB_STEP_SUMMARY
            echo "CANARY_ENVIRONMENT not set; skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          VAR_FILE="${{ vars.CANARY_VAR_FILE }}"
          if [ -z "$VAR_FILE" ]; then
            VAR_FILE="environments/$ENV_NAME.tfvars"
          fi
          
          if [ ! -f "${{ env.WORKING_DIRECTORY }}/$VAR_FILE" ]; then
            echo "## ?? Canary Apply" >> $GITHUB_STEP_SUMMARY
            echo "::error::Canary var file not found: $VAR_FILE" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          STATE_KEY="${{ vars.CANARY_STATE_KEY }}"
          if [ -z "$STATE_KEY" ]; then
            STATE_KEY="$ENV_NAME.terraform.tfstate"
          fi
          
          echo "enabled=true" >> $GITHUB_OUTPUT
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "var_file=$VAR_FILE" >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT

      - name: Canary Plan
        id: canary-plan
        if: steps.canary.outputs.enabled == 'true'
        uses: ./.github/actions/plan
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ steps.canary.outputs.state_key }}
          var_file: ${{ steps.canary.outputs.var_file }}
          environment: ${{ steps.canary.outputs.env_name }}
          parallelism: ${{ env.TF_PARALLELISM }}
          lock_timeout: ${{ env.TF_LOCK_TIMEOUT }}

      - name: Canary Apply
        if: steps.canary.outputs.enabled == 'true'
        uses: ./.github/actions/apply
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ steps.canary.outputs.state_key }}
          environment: ${{ steps.canary.outputs.env_name }}
          plan_artifact: tfplan-${{ steps.canary.outputs.env_name }}-${{ github.sha }}
          parallelism: ${{ env.TF_PARALLELISM }}
          lock_timeout: ${{ env.TF_LOCK_TIMEOUT }}

  # =========================================================================
  # STAGE 8: APPLY (Single environment mode only)
  # =========================================================================
  apply:
    name: '8. Apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [router, plan, cost-estimate, tag-audit, canary]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      needs.tag-audit.result != 'failure' &&
      needs.canary.result != 'failure' &&
      needs.router.outputs.mode != 'drift' &&
      needs.router.outputs.mode != 'matrix' &&
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'apply'
    environment: ${{ inputs.environment || github.event.inputs.environment || 'lab' }}
    outputs:
      start_time: ${{ steps.timer.outputs.start }}
      apply_result: ${{ steps.apply.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Change Freeze Window Check
        if: env.ENABLE_FREEZE_WINDOW == 'true'
        run: |
          HOUR=$(date -u +%H)
          DAY=$(date -u +%u)  # 1=Monday, 7=Sunday
          
          # Block deployments Friday 5PM - Monday 9AM UTC
          if ([ "$DAY" -eq 5 ] && [ "$HOUR" -ge 17 ]) || \
             [ "$DAY" -eq 6 ] || [ "$DAY" -eq 7 ] || \
             ([ "$DAY" -eq 1 ] && [ "$HOUR" -lt 9 ]); then
            echo "## ⛔ Change Freeze Window Active" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Deployments are blocked during the weekend change freeze." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Freeze Period:** Friday 5PM - Monday 9AM UTC" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Set \`ENABLE_FREEZE_WINDOW=false\` to override." >> $GITHUB_STEP_SUMMARY
            echo "::error::Deployments blocked during change freeze window (Friday 5PM - Monday 9AM UTC)"
            exit 1
          fi
          echo "✅ Outside change freeze window - deployment allowed" >> $GITHUB_STEP_SUMMARY

      - name: Start Timer
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: State Backup
        uses: ./.github/actions/state-backup
        with:
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          access_key: ${{ secrets.ARM_ACCESS_KEY }}
          storage_account: ${{ secrets.TF_STATE_SA }}
          resource_group: ${{ secrets.TF_STATE_RG }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate
        continue-on-error: true  # Don't fail apply if backup fails (e.g., first deployment)

      - name: Apply
        id: apply
        uses: ./.github/actions/apply
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate
          environment: ${{ env.ENVIRONMENT }}
          plan_artifact: tfplan-${{ env.ENVIRONMENT }}-${{ github.sha }}
          parallelism: ${{ env.TF_PARALLELISM }}
          lock_timeout: ${{ env.TF_LOCK_TIMEOUT }}

      - name: Post-Apply Smoke Test
        id: smoke-test
        if: success()
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "## 🔥 Post-Apply Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Basic Azure connectivity check
          echo "### Azure Connectivity" >> $GITHUB_STEP_SUMMARY
          if az account show > /dev/null 2>&1; then
            echo "✅ Azure CLI authenticated" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Azure CLI not authenticated" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check if resources in state are accessible
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resource Verification" >> $GITHUB_STEP_SUMMARY
          
          # List resources from state (non-sensitive)
          RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l || echo "0")
          echo "- Resources in state: $RESOURCE_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Verify key resource groups exist (customize as needed)
          RG_NAME="rg-${{ env.ENVIRONMENT }}"
          if az group show --name "$RG_NAME" > /dev/null 2>&1; then
            echo "✅ Resource group $RG_NAME exists" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Resource group $RG_NAME not found (may use different naming)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Smoke test completed" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Rollback on Apply Failure
        if: failure() && steps.apply.outcome == 'failure'
        run: |
          echo "## ⚠️ Apply Failed - Rollback Available" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The apply step failed. A state backup was created before the apply." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To Rollback:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Actions → Run workflow" >> $GITHUB_STEP_SUMMARY
          echo "2. Use the **state-restore** action with:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`state_key\`: ${{ env.ENVIRONMENT }}.terraform.tfstate" >> $GITHUB_STEP_SUMMARY
          echo "   - \`confirm\`: RESTORE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or run manually:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# List available backups" >> $GITHUB_STEP_SUMMARY
          echo "az storage blob list --account-name ${{ secrets.TF_STATE_SA }} --container-name tfstate-backup --query \"[?contains(name,'${{ env.ENVIRONMENT }}')].name\" -o tsv" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "::warning::Apply failed - manual rollback may be required. State backup is available."

      - name: Resource Inventory
        if: success()
        uses: ./.github/actions/resource-inventory
        with:
          environment: ${{ env.ENVIRONMENT }}
          format: json
          working_directory: ${{ env.WORKING_DIRECTORY }}

      - name: Change Log
        if: success()
        uses: ./.github/actions/changelog
        with:
          environment: ${{ env.ENVIRONMENT }}
          working_directory: ${{ env.WORKING_DIRECTORY }}

      - name: Create Audit Log Entry
        if: always()
        id: audit
        run: |
          cat > audit-entry.json << EOF
          {
            "timestamp": "$(date -Iseconds)",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "actor": "$GITHUB_ACTOR",
            "environment": "${{ env.ENVIRONMENT }}",
            "action": "apply",
            "result": "${{ steps.apply.outcome }}",
            "commit_sha": "${{ github.sha }}",
            "commit_message": "$(git log -1 --pretty=%s 2>/dev/null || echo 'N/A')",
            "branch": "${{ github.ref_name }}",
            "resources_added": ${{ needs.plan.outputs.add || 0 }},
            "resources_changed": ${{ needs.plan.outputs.change || 0 }},
            "resources_destroyed": ${{ needs.plan.outputs.destroy || 0 }},
            "duration_seconds": $(($(date +%s) - ${{ steps.timer.outputs.start }})),
            "triggered_by": "${{ github.event_name }}",
            "repository": "${{ github.repository }}"
          }
          EOF
          
          echo "## 📋 Audit Log Entry Created" >> $GITHUB_STEP_SUMMARY
          cat audit-entry.json >> $GITHUB_STEP_SUMMARY

      - name: Upload Audit Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: audit-entry.json
          retention-days: 2555  # 7 years for compliance

      - name: Send Audit to Azure Log Analytics
        if: always() && env.LOG_ANALYTICS_WORKSPACE_ID != ''
        run: |
          echo "Sending audit log to Azure Log Analytics..."
          # Note: Requires LOG_ANALYTICS_SHARED_KEY secret for full integration
          # This is a placeholder for the Log Analytics Data Collector API
          echo "Audit log would be sent to workspace: ${{ env.LOG_ANALYTICS_WORKSPACE_ID }}"
        continue-on-error: true

      - name: Notify Success
        if: success()
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          status: 'success'
          environment: ${{ env.ENVIRONMENT }}
          message: 'Terraform apply completed successfully'
          title: '✅ Infrastructure Deployed'
        continue-on-error: true

      - name: Notify Failure
        if: failure()
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          status: 'failure'
          environment: ${{ env.ENVIRONMENT }}
          message: 'Terraform apply failed - check workflow logs'
          title: '❌ Deployment Failed'
        continue-on-error: true

  # =========================================================================
  # STAGE 10: METRICS (After single-env apply)
  # =========================================================================
  metrics:
    name: '10. Metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, apply, plan]
    if: always() && needs.apply.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/metrics
        with:
          environment: ${{ env.ENVIRONMENT }}
          action: ${{ inputs.action || github.event.inputs.action || 'plan' }}
          start_time: ${{ needs.apply.outputs.start_time || github.run_id }}
          status: ${{ needs.apply.result }}
          add_count: ${{ needs.plan.outputs.add || '0' }}
          change_count: ${{ needs.plan.outputs.change || '0' }}
          destroy_count: ${{ needs.plan.outputs.destroy || '0' }}

  # =========================================================================
  # STAGE 10A: HEALTH CHECK PROBES (After apply)
  # =========================================================================
  health-check:
    name: '10a. Health Check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, apply, plan]
    if: always() && needs.apply.result == 'success' && vars.ENABLE_HEALTH_CHECK == 'true'
    outputs:
      health_status: ${{ steps.health.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure Login (OIDC)
        if: env.USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Legacy)
        if: env.USE_OIDC != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init Terraform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ env.ENVIRONMENT }}.terraform.tfstate"

      - name: Run Health Probes
        id: health
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "## 🏥 Post-Deployment Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          FAIL_COUNT=0
          PASS_COUNT=0
          
          # Get terraform outputs
          terraform output -json > outputs.json 2>/dev/null || echo "{}" > outputs.json
          
          echo "### Azure Resource Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check resource groups
          echo "#### Resource Groups" >> $GITHUB_STEP_SUMMARY
          RG_NAME="rg-${{ env.ENVIRONMENT }}"
          CUSTOM_RG=$(jq -r '.resource_group_name.value // empty' outputs.json)
          [ -n "$CUSTOM_RG" ] && RG_NAME="$CUSTOM_RG"
          
          if az group show --name "$RG_NAME" > /dev/null 2>&1; then
            echo "- ✅ Resource group \`$RG_NAME\` exists" >> $GITHUB_STEP_SUMMARY
            PASS_COUNT=$((PASS_COUNT + 1))
          else
            echo "- ⚠️ Resource group \`$RG_NAME\` not found (may use different naming)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check resources from terraform state
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Resources in State" >> $GITHUB_STEP_SUMMARY
          RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l || echo "0")
          echo "- Total resources managed: $RESOURCE_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # HTTP endpoint checks from outputs
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Endpoint Health" >> $GITHUB_STEP_SUMMARY
          
          # Check any URL outputs
          for key in $(jq -r 'keys[]' outputs.json); do
            value=$(jq -r ".$key.value // empty" outputs.json)
            if [[ "$value" == http* ]]; then
              echo -n "- \`$key\`: " >> $GITHUB_STEP_SUMMARY
              status=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$value" 2>/dev/null || echo "000")
              if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
                echo "✅ HTTP $status" >> $GITHUB_STEP_SUMMARY
                PASS_COUNT=$((PASS_COUNT + 1))
              else
                echo "⚠️ HTTP $status" >> $GITHUB_STEP_SUMMARY
                FAIL_COUNT=$((FAIL_COUNT + 1))
              fi
            fi
          done
          
          # Azure Resource Health check
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Azure Resource Health API" >> $GITHUB_STEP_SUMMARY
          
          UNHEALTHY=$(az resource list --query "[].id" -o tsv 2>/dev/null | head -5 | while read id; do
            az rest --method get --uri "$id/providers/Microsoft.ResourceHealth/availabilityStatuses/current?api-version=2022-10-01" 2>/dev/null | \
              jq -r 'select(.properties.availabilityState != "Available") | .properties.availabilityState'
          done | grep -v "^$" | wc -l)
          
          if [ "$UNHEALTHY" -gt 0 ]; then
            echo "- ⚠️ $UNHEALTHY resource(s) not in healthy state" >> $GITHUB_STEP_SUMMARY
            FAIL_COUNT=$((FAIL_COUNT + 1))
          else
            echo "- ✅ All checked resources are healthy" >> $GITHUB_STEP_SUMMARY
            PASS_COUNT=$((PASS_COUNT + 1))
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: $PASS_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: $FAIL_COUNT" >> $GITHUB_STEP_SUMMARY
          
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Some health checks failed" >> $GITHUB_STEP_SUMMARY
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All health checks passed" >> $GITHUB_STEP_SUMMARY
            echo "status=healthy" >> $GITHUB_OUTPUT
          fi

  # =========================================================================
  # STAGE 10B: E2E SMOKE TESTS (After apply, optional)
  # =========================================================================
  e2e-tests:
    name: '10b. E2E Smoke Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [router, apply, health-check]
    if: always() && needs.apply.result == 'success' && vars.ENABLE_E2E_TESTS == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure Login (OIDC)
        if: env.USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Legacy)
        if: env.USE_OIDC != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Get Terraform Outputs
        id: outputs
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ env.ENVIRONMENT }}.terraform.tfstate"
          terraform output -json > outputs.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run E2E Tests
        shell: bash
        run: |
          echo "## 🧪 E2E Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if custom test script exists
          if [ -f "tests/e2e/smoke.sh" ]; then
            echo "Running custom smoke tests..." >> $GITHUB_STEP_SUMMARY
            chmod +x tests/e2e/smoke.sh
            ./tests/e2e/smoke.sh >> $GITHUB_STEP_SUMMARY 2>&1 || true
          else
            echo "### Default Smoke Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Run basic Azure CLI checks
            echo "#### Resource Verification" >> $GITHUB_STEP_SUMMARY
            
            # List resources in environment
            RG_PATTERN="*${{ env.ENVIRONMENT }}*"
            RESOURCES=$(az resource list --query "[?contains(resourceGroup,'${{ env.ENVIRONMENT }}')].{Name:name,Type:type}" -o table 2>/dev/null | head -20)
            
            if [ -n "$RESOURCES" ]; then
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "$RESOURCES" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ Resources verified" >> $GITHUB_STEP_SUMMARY
            else
              echo "No resources found matching pattern" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ env.ENVIRONMENT }}-${{ github.sha }}
          path: |
            tests/e2e/results/
            ${{ env.WORKING_DIRECTORY }}/outputs.json
          retention-days: 30
        continue-on-error: true

  # =========================================================================
  # STAGE 10C: PERFORMANCE BASELINE (After apply, optional)
  # =========================================================================
  performance-baseline:
    name: '10c. Performance Baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, apply]
    if: always() && needs.apply.result == 'success' && vars.ENABLE_PERFORMANCE_BASELINE == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure Login (OIDC)
        if: env.USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Legacy)
        if: env.USE_OIDC != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Capture Performance Baseline
        shell: bash
        run: |
          echo "## 📈 Performance Baseline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Captured at: $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Create baseline file
          cat > performance-baseline.json << EOF
          {
            "timestamp": "$(date -Iseconds)",
            "environment": "${{ env.ENVIRONMENT }}",
            "commit": "${{ github.sha }}",
            "metrics": {}
          }
          EOF
          
          echo "### Compute Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get VM metrics if any VMs exist
          VMS=$(az vm list --query "[?contains(resourceGroup,'${{ env.ENVIRONMENT }}')].{Name:name,RG:resourceGroup}" -o json 2>/dev/null || echo "[]")
          
          if [ "$VMS" != "[]" ]; then
            echo "| VM | CPU % (avg) | Memory % (avg) |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|-------------|----------------|" >> $GITHUB_STEP_SUMMARY
            
            echo "$VMS" | jq -r '.[] | "\(.Name) \(.RG)"' | while read name rg; do
              CPU=$(az monitor metrics list --resource "/subscriptions/${{ env.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$rg/providers/Microsoft.Compute/virtualMachines/$name" \
                --metric "Percentage CPU" --interval PT5M --aggregation Average \
                --query "value[0].timeseries[0].data[-1].average" -o tsv 2>/dev/null || echo "N/A")
              echo "| $name | $CPU | N/A |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No VMs found in environment" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Storage Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get storage account metrics
          SAS=$(az storage account list --query "[?contains(resourceGroup,'${{ env.ENVIRONMENT }}')].name" -o tsv 2>/dev/null | head -5)
          
          if [ -n "$SAS" ]; then
            echo "| Storage Account | Used Capacity |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------------|---------------|" >> $GITHUB_STEP_SUMMARY
            for sa in $SAS; do
              CAPACITY=$(az storage account show --name "$sa" --query "primaryEndpoints.blob" -o tsv 2>/dev/null || echo "N/A")
              echo "| $sa | Check Azure Portal |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No storage accounts found in environment" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Performance baseline captured" >> $GITHUB_STEP_SUMMARY

      - name: Upload Performance Baseline
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-${{ env.ENVIRONMENT }}-${{ github.sha }}
          path: performance-baseline.json
          retention-days: 90

  # =========================================================================
  # STAGE 11: COMPLIANCE REPORT (After apply)
  # =========================================================================
  compliance-report:
    name: '11. Compliance Report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [router, apply, plan, metrics, health-check]
    if: always() && needs.apply.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Generate Compliance Report
        shell: bash
        run: |
          echo "## 📋 Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated: $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Create compliance report
          mkdir -p compliance-reports
          
          cat > compliance-reports/compliance-report-${{ github.run_id }}.md << EOF
          # Infrastructure Compliance Report
          
          **Generated:** $(date -Iseconds)
          **Environment:** ${{ env.ENVIRONMENT }}
          **Commit:** ${{ github.sha }}
          **Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Actor:** ${{ github.actor }}
          
          ---
          
          ## Security Scan Results
          
          | Scanner | Result | Details |
          |---------|--------|---------|
          | tfsec | Completed | Static analysis for security issues |
          | Checkov | Completed | Policy-as-code compliance |
          | Terrascan | Completed | Security scanner |
          | Secret Scan | Completed | Gitleaks secret detection |
          
          ## Deployment Summary
          
          | Metric | Value |
          |--------|-------|
          | Resources Added | ${{ needs.plan.outputs.add || '0' }} |
          | Resources Changed | ${{ needs.plan.outputs.change || '0' }} |
          | Resources Destroyed | ${{ needs.plan.outputs.destroy || '0' }} |
          | Apply Result | ${{ needs.apply.result }} |
          | Health Check | ${{ needs.health-check.outputs.health_status || 'N/A' }} |
          
          ## Approval Trail
          
          - **Triggered by:** ${{ github.event_name }}
          - **Actor:** ${{ github.actor }}
          - **Branch:** ${{ github.ref_name }}
          - **Environment:** ${{ env.ENVIRONMENT }}
          
          ## Artifacts Generated
          
          - Plan output: tfplan-${{ env.ENVIRONMENT }}-${{ github.sha }}
          - Audit log: audit-log-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          - Metrics: metrics-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          
          ---
          
          *This report is automatically generated for compliance tracking.*
          EOF
          
          echo "### Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scans | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | ${{ needs.apply.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.outputs.health_status || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Audit Trail | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Compliance report generated" >> $GITHUB_STEP_SUMMARY

      - name: Upload Compliance Report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: compliance-reports/
          retention-days: 2555  # 7 years for compliance

  # =========================================================================
  # STAGE 11A: SBOM GENERATION (After apply)
  # =========================================================================
  sbom:
    name: '11a. SBOM Generation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [router, apply]
    if: always() && needs.apply.result == 'success' && vars.ENABLE_SBOM == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init Terraform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -backend=false

      - name: Generate SBOM
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "## 📦 Software Bill of Materials (SBOM)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get terraform version info
          TF_VERSION_JSON=$(terraform version -json)
          
          # Get providers
          PROVIDERS_JSON=$(terraform providers -json 2>/dev/null || echo '{"providers":[]}')
          
          # Create CycloneDX SBOM
          cat > sbom.json << EOF
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "version": 1,
            "metadata": {
              "timestamp": "$(date -Iseconds)",
              "component": {
                "type": "application",
                "name": "terraform-infrastructure",
                "version": "${{ github.sha }}"
              },
              "tools": [
                {
                  "vendor": "HashiCorp",
                  "name": "Terraform",
                  "version": "${{ env.TF_VERSION }}"
                }
              ]
            },
            "components": []
          }
          EOF
          
          # Parse providers and add to SBOM
          echo "### Terraform Version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform: ${{ env.TF_VERSION }}" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Providers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Provider | Version | Source |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          terraform providers 2>/dev/null | grep -E "provider\[" | while read line; do
            PROVIDER=$(echo "$line" | sed 's/.*provider\[\([^]]*\)\].*/\1/')
            VERSION=$(echo "$line" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" || echo "N/A")
            echo "| $PROVIDER | $VERSION | registry.terraform.io |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Modules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "modules" ]; then
            echo "| Module | Path |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
            for mod in modules/*/; do
              [ -d "$mod" ] || continue
              MOD_NAME=$(basename "$mod")
              echo "| $MOD_NAME | $mod |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No local modules found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # List external modules if terraform.lock.hcl exists
          if [ -f ".terraform.lock.hcl" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Locked Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            head -50 .terraform.lock.hcl >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ SBOM generated in CycloneDX format" >> $GITHUB_STEP_SUMMARY

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.ENVIRONMENT }}-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/sbom.json
            ${{ env.WORKING_DIRECTORY }}/.terraform.lock.hcl
          retention-days: 365

  # =========================================================================
  # STAGE 12: AUTO-ROLLBACK (On health check failure)
  # =========================================================================
  auto-rollback:
    name: '12. Auto-Rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [router, apply, health-check]
    if: |
      always() &&
      needs.apply.result == 'success' &&
      needs.health-check.outputs.health_status == 'unhealthy' &&
      vars.ENABLE_AUTO_ROLLBACK == 'true'
    environment: ${{ format('{0}-rollback', inputs.environment || github.event.inputs.environment || 'lab') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure Login (OIDC)
        if: env.USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Legacy)
        if: env.USE_OIDC != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Find Latest Backup
        id: backup
        shell: bash
        run: |
          echo "## 🔄 Auto-Rollback Initiated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Health check failed - initiating automatic rollback" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Find latest backup
          BACKUP=$(az storage blob list \
            --account-name "${{ secrets.TF_STATE_SA }}" \
            --container-name "tfstate-backups" \
            --query "[?contains(name,'${{ env.ENVIRONMENT }}')].{Name:name,Created:properties.creationTime}" \
            -o json 2>/dev/null | jq -r 'sort_by(.Created) | last | .Name')
          
          if [ -z "$BACKUP" ] || [ "$BACKUP" == "null" ]; then
            echo "❌ No backup found for environment: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
            echo "::error::No backup available for rollback"
            exit 1
          fi
          
          echo "backup_name=$BACKUP" >> $GITHUB_OUTPUT
          echo "### Backup Found" >> $GITHUB_STEP_SUMMARY
          echo "- Backup: \`$BACKUP\`" >> $GITHUB_STEP_SUMMARY

      - name: Restore State
        if: steps.backup.outputs.backup_name != ''
        shell: bash
        run: |
          BACKUP_NAME="${{ steps.backup.outputs.backup_name }}"
          STATE_KEY="${{ env.ENVIRONMENT }}.terraform.tfstate"
          
          echo "### Restoring State" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Source: \`tfstate-backups/$BACKUP_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- Destination: \`tfstate/$STATE_KEY\`" >> $GITHUB_STEP_SUMMARY
          
          # Copy backup to main state
          az storage blob copy start \
            --account-name "${{ secrets.TF_STATE_SA }}" \
            --destination-container "tfstate" \
            --destination-blob "$STATE_KEY" \
            --source-container "tfstate-backups" \
            --source-blob "$BACKUP_NAME" \
            --auth-mode login
          
          # Wait for copy to complete
          sleep 5
          
          STATUS=$(az storage blob show \
            --account-name "${{ secrets.TF_STATE_SA }}" \
            --container-name "tfstate" \
            --name "$STATE_KEY" \
            --query "properties.copy.status" -o tsv 2>/dev/null || echo "unknown")
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback Status: $STATUS" >> $GITHUB_STEP_SUMMARY
          
          if [ "$STATUS" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ State restored successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Copy status: $STATUS - may still be in progress" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Rollback
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          status: 'warning'
          environment: ${{ env.ENVIRONMENT }}
          message: 'Auto-rollback executed due to health check failure. State restored from backup.'
          title: '🔄 Auto-Rollback Executed'
        continue-on-error: true

      - name: Post-Rollback Instructions
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Investigate the deployment failure" >> $GITHUB_STEP_SUMMARY
          echo "2. Review the health check results" >> $GITHUB_STEP_SUMMARY
          echo "3. Run \`terraform plan\` to see current drift" >> $GITHUB_STEP_SUMMARY
          echo "4. Fix issues and redeploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** Only the Terraform state was rolled back. Azure resources may need manual reconciliation." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 9: DESTROY (Single environment mode only, with Approval Gate)
  # =========================================================================
  destroy:
    name: '9. Destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [router, plan]
    if: |
      needs.router.outputs.mode != 'drift' &&
      needs.router.outputs.mode != 'matrix' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.destroy_confirm == 'DESTROY'
    environment: ${{ format('{0}-destroy', inputs.environment || github.event.inputs.environment || 'lab') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Change Freeze Window
        if: env.ENABLE_FREEZE_WINDOW == 'true'
        run: |
          current_day=$(date -u +%u)
          current_hour=$(date -u +%H)
          
          # Block Friday 17:00 UTC through Monday 09:00 UTC
          if [[ $current_day -eq 5 && $current_hour -ge 17 ]] || \
             [[ $current_day -eq 6 ]] || \
             [[ $current_day -eq 7 ]] || \
             [[ $current_day -eq 1 && $current_hour -lt 9 ]]; then
            echo "::error::❄️ CHANGE FREEZE: Destroy operations are blocked during weekends (Friday 5PM - Monday 9AM UTC)"
            echo "Current time: $(date -u)"
            echo "To override, disable ENABLE_FREEZE_WINDOW in workflow env vars"
            exit 1
          fi
          echo "✅ Not in change freeze window - destroy may proceed"
        shell: bash

      - name: State Backup Before Destroy
        uses: ./.github/actions/state-backup
        with:
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          storage_account: ${{ secrets.TF_STATE_SA }}
          resource_group: ${{ secrets.TF_STATE_RG }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate

      - name: Destroy
        uses: ./.github/actions/destroy
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate
          var_file: environments/${{ env.ENVIRONMENT }}.tfvars
          environment: ${{ env.ENVIRONMENT }}
          confirm: ${{ github.event.inputs.destroy_confirm }}
          parallelism: ${{ env.TF_PARALLELISM }}

      - name: Notify Destroy Complete
        if: success()
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          status: 'warning'
          environment: ${{ env.ENVIRONMENT }}
          message: 'Infrastructure has been destroyed'
          title: '🟡 Environment Destroyed'
        continue-on-error: true

  # ===========================================================================
  # ==================== DRIFT DETECTION MODE =================================
  # ===========================================================================
  
  # =========================================================================
  # DRIFT: Detection Matrix (scheduled or manual drift mode)
  # =========================================================================
  drift-detect:
    name: 'Drift Detection - ${{ matrix.environment }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: router
    if: needs.router.outputs.is_drift == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Drift Detection
        uses: ./.github/actions/drift-detect
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          # OIDC Authentication (Recommended)
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          # Legacy Authentication (Fallback)
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          # Backend
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: '${{ matrix.environment }}.terraform.tfstate'
          var_file: 'environments/${{ matrix.environment }}.tfvars'
          environment: ${{ matrix.environment }}
          # Alerting
          create_issue: ${{ github.event.inputs.create_drift_issue || 'true' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_drift: false

  # =========================================================================
  # DRIFT: Notification Summary
  # =========================================================================
  drift-notify:
    name: 'Drift Summary'
    runs-on: ubuntu-latest
    needs: [router, drift-detect]
    if: always() && needs.router.outputs.is_drift == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Results
        id: check
        run: |
          if [ "${{ needs.drift-detect.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Drift detection failed or drift was detected" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All environments are in sync with Terraform configuration" >> $GITHUB_OUTPUT
          fi

      - name: Send Notification
        if: vars.SLACK_WEBHOOK_URL != '' || vars.TEAMS_WEBHOOK_URL != ''
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          title: 'Drift Detection Complete'
          message: ${{ steps.check.outputs.message }}
          status: ${{ steps.check.outputs.status }}
          environment: 'all'
        continue-on-error: true

      - name: Summary
        run: |
          echo "## 🔍 Drift Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Overall | ${{ needs.drift-detect.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered: ${{ github.event_name == 'schedule' && 'Scheduled (daily 6 AM UTC)' || 'Manual' }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # ==================== MATRIX DEPLOYMENT MODE ===============================
  # ===========================================================================

  # =========================================================================
  # MATRIX: Plan for each environment
  # =========================================================================
  matrix-plan:
    name: 'Matrix Plan - ${{ matrix.environment }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [router, validate, terraform-tests, module-contracts, docs-check, security-tfsec, security-checkov, security-terrascan, secret-scan, shellcheck, tflint, policy-check]
    if: needs.router.outputs.is_matrix == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.router.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Plan
        id: plan
        uses: ./.github/actions/plan
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ matrix.environment }}.terraform.tfstate
          var_file: environments/${{ matrix.environment }}.tfvars
          environment: ${{ matrix.environment }}
          parallelism: ${{ env.TF_PARALLELISM }}

  # =========================================================================
  # MATRIX: Apply dev first
  # =========================================================================
  matrix-apply-dev:
    name: 'Matrix Apply - dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [router, matrix-plan]
    if: |
      needs.router.outputs.is_matrix == 'true' &&
      github.event.inputs.action == 'apply' && 
      contains(github.event.inputs.environments, 'dev')
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/apply
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: dev.terraform.tfstate
          environment: dev
          plan_artifact: tfplan-dev-${{ github.sha }}
          parallelism: ${{ env.TF_PARALLELISM }}

  # =========================================================================
  # MATRIX: Apply staging after dev
  # =========================================================================
  matrix-apply-staging:
    name: 'Matrix Apply - staging'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [router, matrix-plan, matrix-apply-dev]
    if: |
      always() &&
      needs.router.outputs.is_matrix == 'true' &&
      (needs.matrix-apply-dev.result == 'success' || needs.matrix-apply-dev.result == 'skipped') &&
      github.event.inputs.action == 'apply' && 
      contains(github.event.inputs.environments, 'staging')
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/apply
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: staging.terraform.tfstate
          environment: staging
          plan_artifact: tfplan-staging-${{ github.sha }}
          parallelism: ${{ env.TF_PARALLELISM }}

  # =========================================================================
  # MATRIX: Apply prod after staging
  # =========================================================================
  matrix-apply-prod:
    name: 'Matrix Apply - prod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [router, matrix-plan, matrix-apply-staging]
    if: |
      always() &&
      needs.router.outputs.is_matrix == 'true' &&
      (needs.matrix-apply-staging.result == 'success' || needs.matrix-apply-staging.result == 'skipped') &&
      github.event.inputs.action == 'apply' && 
      contains(github.event.inputs.environments, 'prod')
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/apply
        with:
          terraform_version: ${{ env.TF_VERSION }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: prod.terraform.tfstate
          environment: prod
          plan_artifact: tfplan-prod-${{ github.sha }}
          parallelism: ${{ env.TF_PARALLELISM }}

  # =========================================================================
  # MATRIX: Summary Notification
  # =========================================================================
  matrix-notify:
    name: 'Matrix Summary'
    runs-on: ubuntu-latest
    needs: [router, matrix-apply-dev, matrix-apply-staging, matrix-apply-prod]
    if: always() && needs.router.outputs.is_matrix == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deployment Summary
        run: |
          echo "## 📊 Multi-Environment Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Check each environment result
          if [ "${{ needs.matrix-apply-dev.result }}" == "success" ]; then
            echo "| dev | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.matrix-apply-dev.result }}" == "skipped" ]; then
            echo "| dev | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| dev | ❌ ${{ needs.matrix-apply-dev.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.matrix-apply-staging.result }}" == "success" ]; then
            echo "| staging | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.matrix-apply-staging.result }}" == "skipped" ]; then
            echo "| staging | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| staging | ❌ ${{ needs.matrix-apply-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.matrix-apply-prod.result }}" == "success" ]; then
            echo "| prod | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.matrix-apply-prod.result }}" == "skipped" ]; then
            echo "| prod | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| prod | ❌ ${{ needs.matrix-apply-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send Notification
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          status: ${{ (needs.matrix-apply-dev.result == 'failure' || needs.matrix-apply-staging.result == 'failure' || needs.matrix-apply-prod.result == 'failure') && 'failure' || 'success' }}
          environment: 'multi-env'
          message: 'Matrix deployment completed for: ${{ github.event.inputs.environments }}'
          title: '🎯 Matrix Deploy Complete'
        continue-on-error: true
