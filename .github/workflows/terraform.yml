# =============================================================================
# TERRAFORM PIPELINE - Azure Landing Zone (Extended)
# =============================================================================
# Full-featured pipeline with security, cost estimation, testing, and more
# Can be used directly or called from other repositories via workflow_call
# =============================================================================

name: 'Terraform Pipeline'

on:
  push:
    branches: [main]
    paths: ['**.tf', '**.tfvars', 'modules/**', 'landing-zones/**', 'environments/**']
  pull_request:
    branches: [main]
    paths: ['**.tf', '**.tfvars']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'lab'
        type: choice
        options: [dev, lab, prod]
      action:
        description: 'Action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      destroy_confirm:
        description: 'Type DESTROY to confirm'
        required: false
        type: string
  # Reusable workflow support
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: string
      action:
        description: 'Action (plan, apply, destroy)'
        required: false
        type: string
        default: 'plan'
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.9.0'
      working_directory:
        description: 'Working directory'
        required: false
        type: string
        default: '.'
    secrets:
      AZURE_CREDENTIALS:
        required: false
      TF_STATE_RG:
        required: true
      TF_STATE_SA:
        required: true
      INFRACOST_API_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: false

concurrency:
  group: terraform-${{ github.ref }}-${{ github.event.inputs.environment || 'lab' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  security-events: write
  id-token: write

env:
  TF_VERSION: '1.9.0'
  ENVIRONMENT: ${{ github.event.inputs.environment || 'lab' }}
  # OIDC Configuration (set USE_OIDC=true in repo variables to enable)
  USE_OIDC: ${{ vars.USE_OIDC || 'false' }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Performance Tuning
  TF_PARALLELISM: '20'
  TF_LOCK_TIMEOUT: '10m'
  # Blast Radius Threshold (alert if destroy count exceeds)
  BLAST_RADIUS_THRESHOLD: '10'

jobs:
  # =========================================================================
  # STAGE 1: FORMAT CHECK
  # =========================================================================
  format:
    name: '1️⃣ Format Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format Check
        run: |
          if ! terraform fmt -check -recursive -diff; then
            echo "## ❌ Format Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "Run \`terraform fmt -recursive\` locally to fix." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Format Check Passed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 2: VALIDATE
  # =========================================================================
  validate:
    name: '2️⃣ Validate'
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate
          echo "## ✅ Validation Passed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 3: SECURITY - TFSEC
  # =========================================================================
  security-tfsec:
    name: '3️⃣ Security - tfsec'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          format: sarif
          additional_args: --out tfsec-results.sarif
        continue-on-error: true

      - name: Upload tfsec SARIF
        if: always()
        shell: bash
        run: |
          if [ -f tfsec-results.sarif ]; then
            echo "tfsec SARIF exists; uploading."
          else
            echo "tfsec SARIF not found; skipping upload."
          fi

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('tfsec-results.sarif') != ''
        with:
          sarif_file: tfsec-results.sarif
        continue-on-error: true

      - run: echo "## 🔒 tfsec scan completed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 3: SECURITY - CHECKOV
  # =========================================================================
  security-checkov:
    name: '3️⃣ Security - Checkov'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
        continue-on-error: true

      - run: echo "## 🛡️ Checkov scan completed" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 3: SECRET SCANNING (NEW)
  # =========================================================================
  secret-scan:
    name: '3️⃣ Security - Secrets'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/secret-scan

  # =========================================================================
  # STAGE 4: TFLINT
  # =========================================================================
  tflint:
    name: '4️⃣ Lint - TFLint'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          cat > .tflint.hcl << 'EOF'
          plugin "azurerm" {
            enabled = true
            version = "0.27.0"
            source  = "github.com/terraform-linters/tflint-ruleset-azurerm"
          }
          EOF
          tflint --init
          echo "## 📏 TFLint Results" >> $GITHUB_STEP_SUMMARY
          tflint --recursive || true
        continue-on-error: true

  # =========================================================================
  # STAGE 4: POLICY CHECK (NEW)
  # =========================================================================
  policy-check:
    name: '4️⃣ Lint - Policy'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init for Policy Check
        run: terraform init -backend=false

      - uses: ./.github/actions/policy-check
        with:
          policy_dir: policies
          soft_fail: 'true'

  # =========================================================================
  # STAGE 4: TERRAFORM DOCS (NEW)
  # =========================================================================
  terraform-docs:
    name: '4️⃣ Lint - Docs'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-docs
        with:
          recursive: 'true'

  # =========================================================================
  # STAGE 5: GRAPH VISUALIZATION (NEW)
  # =========================================================================
  graph:
    name: '5️⃣ Analysis - Graph'
    runs-on: ubuntu-latest
    needs: [security-tfsec, security-checkov, secret-scan, tflint, policy-check]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: ./.github/actions/graph
        with:
          output_format: svg

  # =========================================================================
  # STAGE 5: MODULE VERSION CHECK (NEW)
  # =========================================================================
  module-versions:
    name: '5️⃣ Analysis - Versions'
    runs-on: ubuntu-latest
    needs: [security-tfsec, security-checkov, secret-scan, tflint, policy-check]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend=false

      - uses: ./.github/actions/module-version

  # =========================================================================
  # STAGE 6: COST ESTIMATION (NEW)
  # =========================================================================
  cost-estimate:
    name: '6️⃣ Analysis - Cost'
    runs-on: ubuntu-latest
    needs: [graph, module-versions]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend=false

      - uses: ./.github/actions/cost-estimate
        with:
          api_key: ${{ secrets.INFRACOST_API_KEY }}
          var_file: environments/${{ env.ENVIRONMENT }}.tfvars
          cost_threshold: ${{ vars.COST_THRESHOLD || '500' }}
          cost_increase_threshold: ${{ vars.COST_INCREASE_THRESHOLD || '100' }}
          save_baseline: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true

  # =========================================================================
  # STAGE 6B: VERSION CHECK
  # =========================================================================
  version-check:
    name: '6️⃣ Analysis - Versions'
    runs-on: ubuntu-latest
    needs: [graph, module-versions]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/version-check
        with:
          terraform_version: ${{ env.TF_VERSION }}
          check_cves: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # STAGE 7: PLAN
  # =========================================================================
  plan:
    name: '7️⃣ Plan'
    runs-on: ubuntu-latest
    needs: [graph, module-versions]
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      add: ${{ steps.plan.outputs.add }}
      change: ${{ steps.plan.outputs.change }}
      destroy: ${{ steps.plan.outputs.destroy }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan
        id: plan
        uses: ./.github/actions/plan
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # OIDC Authentication (recommended)
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          # Legacy Authentication (fallback)
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          # Backend Configuration
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate
          var_file: environments/${{ env.ENVIRONMENT }}.tfvars
          environment: ${{ env.ENVIRONMENT }}
          # Performance Tuning
          parallelism: ${{ env.TF_PARALLELISM }}
          lock_timeout: ${{ env.TF_LOCK_TIMEOUT }}

      - name: Blast Radius Check
        if: steps.plan.outputs.destroy != '' && steps.plan.outputs.destroy != '0'
        run: |
          DESTROY_COUNT=${{ steps.plan.outputs.destroy }}
          THRESHOLD=${{ env.BLAST_RADIUS_THRESHOLD }}
          if [ "$DESTROY_COUNT" -ge "$THRESHOLD" ]; then
            echo "## ⚠️ BLAST RADIUS WARNING" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This plan will **destroy $DESTROY_COUNT resources** which exceeds the threshold of $THRESHOLD." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔴 **Manual review required before apply.**" >> $GITHUB_STEP_SUMMARY
            echo "::warning::High blast radius detected: $DESTROY_COUNT resources will be destroyed"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/pr-comment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plan_add: ${{ steps.plan.outputs.add }}
          plan_change: ${{ steps.plan.outputs.change }}
          plan_destroy: ${{ steps.plan.outputs.destroy }}
          plan_file: plan_output.txt
          collapse_plan: 'true'

  # =========================================================================
  # STAGE 8: APPLY
  # =========================================================================
  apply:
    name: '8️⃣ Apply'
    runs-on: ubuntu-latest
    needs: [plan, cost-estimate]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'apply'
    environment: ${{ github.event.inputs.environment }}
    outputs:
      start_time: ${{ steps.timer.outputs.start }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Timer
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: State Backup
        uses: ./.github/actions/state-backup
        with:
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          storage_account: ${{ secrets.TF_STATE_SA }}
          resource_group: ${{ secrets.TF_STATE_RG }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate

      - name: Apply
        id: apply
        uses: ./.github/actions/apply
        with:
          terraform_version: ${{ env.TF_VERSION }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate
          environment: ${{ env.ENVIRONMENT }}
          plan_artifact: tfplan-${{ env.ENVIRONMENT }}-${{ github.sha }}
          parallelism: ${{ env.TF_PARALLELISM }}
          lock_timeout: ${{ env.TF_LOCK_TIMEOUT }}

      - name: Resource Inventory
        uses: ./.github/actions/resource-inventory
        with:
          environment: ${{ env.ENVIRONMENT }}
          format: json

      - name: Change Log
        uses: ./.github/actions/changelog
        with:
          environment: ${{ env.ENVIRONMENT }}

      - name: Notify Success
        if: success()
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          webhook_type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          status: 'success'
          environment: ${{ env.ENVIRONMENT }}
          message: 'Terraform apply completed successfully'
          title: '✅ Infrastructure Deployed'
        continue-on-error: true

      - name: Notify Failure
        if: failure()
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          webhook_type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          status: 'failure'
          environment: ${{ env.ENVIRONMENT }}
          message: 'Terraform apply failed - check workflow logs'
          title: '❌ Deployment Failed'
        continue-on-error: true

  # =========================================================================
  # STAGE 10: METRICS
  # =========================================================================
  metrics:
    name: '🔟 Metrics'
    runs-on: ubuntu-latest
    needs: [apply, plan]
    if: always() && needs.apply.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/metrics
        with:
          environment: ${{ env.ENVIRONMENT }}
          action: ${{ github.event.inputs.action || 'plan' }}
          start_time: ${{ needs.apply.outputs.start_time || github.run_id }}
          status: ${{ needs.apply.result }}
          add_count: ${{ needs.plan.outputs.add || '0' }}
          change_count: ${{ needs.plan.outputs.change || '0' }}
          destroy_count: ${{ needs.plan.outputs.destroy || '0' }}

  # =========================================================================
  # STAGE 9: DESTROY (with Approval Gate)
  # =========================================================================
  destroy:
    name: '9️⃣ Destroy'
    runs-on: ubuntu-latest
    needs: plan
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.destroy_confirm == 'DESTROY'
    environment: ${{ github.event.inputs.environment }}-destroy
    steps:
      - uses: actions/checkout@v4

      - name: State Backup Before Destroy
        uses: ./.github/actions/state-backup
        with:
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          storage_account: ${{ secrets.TF_STATE_SA }}
          resource_group: ${{ secrets.TF_STATE_RG }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate

      - name: Destroy
        uses: ./.github/actions/destroy
        with:
          terraform_version: ${{ env.TF_VERSION }}
          use_oidc: ${{ env.USE_OIDC }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          backend_resource_group: ${{ secrets.TF_STATE_RG }}
          backend_storage_account: ${{ secrets.TF_STATE_SA }}
          state_key: ${{ env.ENVIRONMENT }}.terraform.tfstate
          var_file: environments/${{ env.ENVIRONMENT }}.tfvars
          environment: ${{ env.ENVIRONMENT }}
          confirm: ${{ github.event.inputs.destroy_confirm }}
          parallelism: ${{ env.TF_PARALLELISM }}

      - name: Notify Destroy Complete
        if: success()
        uses: ./.github/actions/notification
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL || secrets.TEAMS_WEBHOOK_URL }}
          webhook_type: ${{ secrets.SLACK_WEBHOOK_URL && 'slack' || 'teams' }}
          status: 'warning'
          environment: ${{ env.ENVIRONMENT }}
          message: 'Infrastructure has been destroyed'
          title: '🟡 Environment Destroyed'
        continue-on-error: true
