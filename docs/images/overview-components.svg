<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3a42" />
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .box { fill: #ffffff; stroke: #2b3a42; stroke-width: 2; rx: 12; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .sub { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5c6b73; }
      .line { stroke: #2b3a42; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="360" />
  <text class="title" x="40" y="50">Pipeline Components Overview</text>

  <rect class="box" x="40" y="120" width="200" height="80" />
  <text class="label" x="60" y="152">Workflows</text>
  <text class="sub" x="60" y="175">router + orchestration</text>

  <rect class="box" x="260" y="120" width="200" height="80" />
  <text class="label" x="280" y="152">Composite Actions</text>
  <text class="sub" x="280" y="175">plan, apply, destroy</text>

  <rect class="box" x="480" y="120" width="200" height="80" />
  <text class="label" x="500" y="152">Security &amp; Policy</text>
  <text class="sub" x="500" y="175">tfsec, checkov, OPA</text>

  <rect class="box" x="700" y="120" width="200" height="80" />
  <text class="label" x="720" y="152">Testing &amp; Cost</text>
  <text class="sub" x="720" y="175">terraform test, Infracost</text>

  <rect class="box" x="920" y="120" width="200" height="80" />
  <text class="label" x="940" y="152">Ops &amp; Drift</text>
  <text class="sub" x="940" y="175">metrics, drift detect</text>

  <line class="line" x1="240" y1="160" x2="260" y2="160" />
  <line class="line" x1="460" y1="160" x2="480" y2="160" />
  <line class="line" x1="680" y1="160" x2="700" y2="160" />
  <line class="line" x1="900" y1="160" x2="920" y2="160" />
</svg>
