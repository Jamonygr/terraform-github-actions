<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect x="0" y="0" width="1200" height="360" fill="#f7f8fa" />

  <text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2a33">Pipeline Components Overview</text>

  <rect x="40" y="120" width="200" height="80" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" />
  <text x="60" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2a33">Workflows</text>
  <text x="60" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c6b73">router + orchestration</text>

  <rect x="260" y="120" width="200" height="80" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" />
  <text x="280" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2a33">Composite Actions</text>
  <text x="280" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c6b73">plan, apply, destroy</text>

  <rect x="480" y="120" width="200" height="80" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" />
  <text x="500" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2a33">Security and Policy</text>
  <text x="500" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c6b73">tfsec, checkov, OPA</text>

  <rect x="700" y="120" width="200" height="80" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" />
  <text x="720" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2a33">Testing and Cost</text>
  <text x="720" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c6b73">terraform test, Infracost</text>

  <rect x="920" y="120" width="200" height="80" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" />
  <text x="940" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2a33">Ops and Drift</text>
  <text x="940" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c6b73">metrics, drift detect</text>

  <line x1="240" y1="160" x2="260" y2="160" stroke="#2b3a42" stroke-width="2" />
  <line x1="460" y1="160" x2="480" y2="160" stroke="#2b3a42" stroke-width="2" />
  <line x1="680" y1="160" x2="700" y2="160" stroke="#2b3a42" stroke-width="2" />
  <line x1="900" y1="160" x2="920" y2="160" stroke="#2b3a42" stroke-width="2" />
</svg>
