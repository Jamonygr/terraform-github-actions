<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3a42" />
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .section { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; rx: 12; }
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .section-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .box { fill: #ffffff; stroke: #2b3a42; stroke-width: 2; rx: 10; }
      .label { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .sub { font: 11px 'Segoe UI', Arial, sans-serif; fill: #5c6b73; }
      .line { stroke: #2b3a42; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="860" />
  <text class="title" x="40" y="45">Terraform Pipeline Overview</text>

  <!-- Single mode -->
  <rect class="section" x="30" y="80" width="1140" height="420" />
  <text class="section-title" x="50" y="110">Single Mode (default for push and PR)</text>

  <rect class="box" x="60" y="130" width="180" height="80" />
  <text class="label" x="80" y="155">Router</text>
  <text class="sub" x="80" y="175">mode selection</text>
  <text class="sub" x="80" y="190">repo hygiene optional</text>

  <rect class="box" x="260" y="130" width="180" height="80" />
  <text class="label" x="280" y="155">Format and Validate</text>
  <text class="sub" x="280" y="175">fmt and validate</text>

  <rect class="box" x="460" y="130" width="180" height="80" />
  <text class="label" x="480" y="155">Quality and Security</text>
  <text class="sub" x="480" y="175">security scans, secret scan</text>
  <text class="sub" x="480" y="190">lint, policy, docs</text>
  <text class="sub" x="480" y="205">tests and contracts optional</text>

  <rect class="box" x="660" y="130" width="180" height="80" />
  <text class="label" x="680" y="155">Analysis</text>
  <text class="sub" x="680" y="175">graph and module versions</text>
  <text class="sub" x="680" y="190">version check</text>
  <text class="sub" x="680" y="205">cost estimate single only</text>

  <rect class="box" x="860" y="130" width="180" height="80" />
  <text class="label" x="880" y="155">Plan</text>
  <text class="sub" x="880" y="175">single mode only</text>
  <text class="sub" x="880" y="190">PR comment, blast radius</text>

  <rect class="box" x="830" y="240" width="240" height="80" />
  <text class="label" x="850" y="265">Post-plan actions</text>
  <text class="sub" x="850" y="285">tag audit optional</text>
  <text class="sub" x="850" y="300">terratest PR, ephemeral PR</text>
  <text class="sub" x="850" y="315">canary optional</text>

  <rect class="box" x="830" y="330" width="240" height="80" />
  <text class="label" x="850" y="355">Apply or Destroy</text>
  <text class="sub" x="850" y="375">manual dispatch</text>
  <text class="sub" x="850" y="390">post-apply checks + reports</text>

  <line class="line" x1="240" y1="170" x2="260" y2="170" />
  <line class="line" x1="440" y1="170" x2="460" y2="170" />
  <line class="line" x1="640" y1="170" x2="660" y2="170" />
  <line class="line" x1="840" y1="170" x2="860" y2="170" />
  <line class="line" x1="950" y1="210" x2="950" y2="240" />
  <line class="line" x1="950" y1="320" x2="950" y2="330" />
  <text class="sub" x="60" y="470">Gated by mode/action/event/vars; skipped jobs are expected.</text>

  <!-- Matrix mode -->
  <rect class="section" x="30" y="520" width="1140" height="170" />
  <text class="section-title" x="50" y="550">Matrix Mode</text>
  <text class="sub" x="50" y="570">Uses the same checks as single mode before matrix plan</text>

  <rect class="box" x="60" y="590" width="180" height="70" />
  <text class="label" x="80" y="620">Matrix plan</text>
  <text class="sub" x="80" y="640">per environment</text>

  <rect class="box" x="270" y="590" width="180" height="70" />
  <text class="label" x="290" y="620">Apply dev</text>

  <rect class="box" x="480" y="590" width="180" height="70" />
  <text class="label" x="500" y="620">Apply staging</text>

  <rect class="box" x="690" y="590" width="180" height="70" />
  <text class="label" x="710" y="620">Apply prod</text>

  <rect class="box" x="900" y="590" width="180" height="70" />
  <text class="label" x="920" y="620">Matrix summary</text>

  <line class="line" x1="240" y1="625" x2="270" y2="625" />
  <line class="line" x1="450" y1="625" x2="480" y2="625" />
  <line class="line" x1="660" y1="625" x2="690" y2="625" />
  <line class="line" x1="870" y1="625" x2="900" y2="625" />

  <!-- Drift mode -->
  <rect class="section" x="30" y="710" width="1140" height="130" />
  <text class="section-title" x="50" y="740">Drift Mode</text>
  <text class="sub" x="50" y="760">Schedule or manual refresh-only plans</text>

  <rect class="box" x="220" y="770" width="260" height="70" />
  <text class="label" x="240" y="800">Drift detect</text>
  <text class="sub" x="240" y="820">schedule or manual</text>
  <text class="sub" x="240" y="835">dev and prod matrix</text>

  <rect class="box" x="720" y="770" width="260" height="70" />
  <text class="label" x="740" y="800">Summary and notify</text>
  <text class="sub" x="740" y="820">issue optional</text>

  <line class="line" x1="480" y1="805" x2="720" y2="805" />
</svg>
