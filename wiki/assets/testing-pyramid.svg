<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .box { fill: #ffffff; stroke: #2b3a42; stroke-width: 2; rx: 10; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="420" />
  <text class="title" x="40" y="50">Testing Pyramid</text>

  <rect class="box" x="450" y="120" width="300" height="60" />
  <text class="label" x="600" y="155" text-anchor="middle">Module Contracts</text>

  <rect class="box" x="390" y="190" width="420" height="60" />
  <text class="label" x="600" y="225" text-anchor="middle">Terratest Integration</text>

  <rect class="box" x="320" y="260" width="560" height="60" />
  <text class="label" x="600" y="295" text-anchor="middle">Terraform Test</text>

  <rect class="box" x="250" y="330" width="700" height="60" />
  <text class="label" x="600" y="365" text-anchor="middle">Lint + Validate</text>
</svg>
