<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .box { fill: #ffffff; stroke: #2b3a42; stroke-width: 2; rx: 10; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .sub { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5c6b73; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="420" />
  <text class="title" x="40" y="50">Actions Catalog</text>

  <rect class="box" x="80" y="90" width="360" height="90" />
  <text class="label" x="100" y="125">Core Actions</text>
  <text class="sub" x="100" y="150">setup, validate, plan, apply, destroy</text>

  <rect class="box" x="760" y="90" width="360" height="90" />
  <text class="label" x="780" y="125">Security Actions</text>
  <text class="sub" x="780" y="150">security, secret-scan, policy-check</text>

  <rect class="box" x="80" y="210" width="360" height="90" />
  <text class="label" x="100" y="245">State Actions</text>
  <text class="sub" x="100" y="270">state-backup, state-restore, drift-detect</text>

  <rect class="box" x="760" y="210" width="360" height="90" />
  <text class="label" x="780" y="245">Communication</text>
  <text class="sub" x="780" y="270">pr-comment, notification</text>

  <rect class="box" x="80" y="330" width="360" height="90" />
  <text class="label" x="100" y="365">Utilities</text>
  <text class="sub" x="100" y="390">cost-estimate, terraform-docs, metrics</text>
  <text class="sub" x="100" y="408">graph, resource-inventory, version-check</text>

  <rect class="box" x="760" y="330" width="360" height="90" />
  <text class="label" x="780" y="365">Module Ops</text>
  <text class="sub" x="780" y="390">module-version, changelog</text>
</svg>
