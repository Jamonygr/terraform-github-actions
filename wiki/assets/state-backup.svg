<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3a42" />
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .box { fill: #ffffff; stroke: #2b3a42; stroke-width: 2; rx: 10; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .sub { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5c6b73; }
      .line { stroke: #2b3a42; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="360" />
  <text class="title" x="40" y="50">State Backup and Restore</text>

  <rect class="box" x="120" y="110" width="220" height="70" />
  <text class="label" x="140" y="140">Apply / Destroy</text>
  <text class="sub" x="140" y="162">auto or manual</text>

  <rect class="box" x="440" y="110" width="220" height="70" />
  <text class="label" x="460" y="140">State Backup</text>
  <text class="sub" x="460" y="162">snapshot before change</text>

  <rect class="box" x="760" y="110" width="220" height="70" />
  <text class="label" x="780" y="140">State Backend</text>
  <text class="sub" x="780" y="162">tfstate + tfstate-backups</text>

  <rect class="box" x="760" y="230" width="220" height="70" />
  <text class="label" x="780" y="260">Restore</text>
  <text class="sub" x="780" y="282">select backup</text>

  <line class="line" x1="340" y1="145" x2="440" y2="145" />
  <line class="line" x1="660" y1="145" x2="760" y2="145" />
  <line class="line" x1="870" y1="230" x2="870" y2="180" />
</svg>
