<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3a42" />
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .box { fill: #ffffff; stroke: #2b3a42; stroke-width: 2; rx: 10; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a33; }
      .sub { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5c6b73; }
      .line { stroke: #2b3a42; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="360" />
  <text class="title" x="40" y="50">Drift Detection Loop</text>

  <rect class="box" x="40" y="140" width="180" height="60" />
  <text class="label" x="60" y="175">Schedule</text>

  <rect class="box" x="250" y="140" width="180" height="60" />
  <text class="label" x="270" y="175">Drift Scan</text>

  <rect class="box" x="460" y="140" width="180" height="60" />
  <text class="label" x="480" y="175">Issue or Alert</text>

  <rect class="box" x="670" y="140" width="180" height="60" />
  <text class="label" x="690" y="175">Plan</text>

  <rect class="box" x="880" y="140" width="180" height="60" />
  <text class="label" x="900" y="175">Apply</text>

  <line class="line" x1="220" y1="170" x2="250" y2="170" />
  <line class="line" x1="430" y1="170" x2="460" y2="170" />
  <line class="line" x1="640" y1="170" x2="670" y2="170" />
  <line class="line" x1="850" y1="170" x2="880" y2="170" />

  <path class="line" d="M 970 170 L 1040 170 L 1040 260 L 70 260 L 70 170 L 130 170" />
</svg>
